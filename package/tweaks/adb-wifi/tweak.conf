name=ADB over Wi-Fi
summary=Lets a computer on the car's Wi-Fi control the head unit
description=Turns on ADB on port 5555 over the car's Wi-Fi, and shows the ADB switch in Engineering Mode so it can be turned back on from the screen. Warning: there is no password. Anyone on the car's Wi-Fi can control the head unit. Turning it off puts everything back; ADB then stops at the next restart.
firmware=CVEV.USA.0000.V015.012.260507
kind=oneshot
default=off
need=prop:persist.service.adb.tcp.enable | Turn on the head unit's own ADB TCP switch, the one in Engineering Mode
need=prop:persist.adb.tcp.port | Make ADB listen on port 5555
need=file:/system/etc/permissions/com.hkmc.software.engineermode.adb_hide.xml@bb94dd63efd6d3494834e649653f795f | Show the ADB switch in Engineering Mode, so ADB can be turned back on from the screen
need=file:/system/build.prop@30e9666d146efe83697f155574d50d30 | Put build.prop back as it ships when this is turned off, if the TCP ADB package added lines to it
