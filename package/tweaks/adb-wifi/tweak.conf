name=ADB over Wi-Fi
summary=Lets a computer on the car's Wi-Fi control the head unit
description=Turns on ADB on port 5555 over the car's Wi-Fi, and shows the ADB switch in Engineering Mode so it can be turned back on from the screen. Warning: there is no password. Anyone on the car's Wi-Fi can control the head unit. Turning it off puts everything back; ADB then stops at the next restart.
firmware=CVEV.USA.0000.V015.012.260507
